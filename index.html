<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060709" />
    <script>
      // the look is set before the first paint, so a dark page does not flash light (same rule as src/lib/theme.ts)
      (function () {
        try {
          var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('sl.theme') || 'swiatlo';
          if (t !== 'classic') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'swiatlo');
        }
      })();
    </script>
    <title>Sparing Live</title>
    <meta name="description" content="Rehearse the call you are afraid of: a real-time voice sparring partner on Meta's Muse models that interrupts you, reads your screen, shows its mood and can hang up, and afterwards shows what it was privately thinking." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sparing Live: rehearse the call you are afraid of" />
    <meta property="og:description" content="A voice that interrupts you, reads your screen, hangs up, and shows what it was thinking. Built on Meta's Muse models." />
    <meta property="og:image" content="https://raw.githubusercontent.com/antonipuszczahub/sparing-live-muse/main/docs/img/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:opsz,wght@9..144,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.5">Sparing Live is a voice app and needs JavaScript. Turn it on for this page and reload.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
